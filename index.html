<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa CAA - Universo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .no-print {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-generate {
            background-color: #3498db;
            color: white;
        }

        .btn-generate:hover {
            background-color: #2980b9;
        }

        .btn-print {
            background-color: #2ecc71;
            color: white;
        }

        .btn-print:hover {
            background-color: #27ae60;
        }

        /* Griglia CAA */
        .caa-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .caa-card {
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            aspect-ratio: 1 / 1.1;
            text-align: center;
            page-break-inside: avoid;
        }

        .caa-card img {
            max-width: 80%;
            max-height: 70%;
            object-fit: contain;
        }

        .caa-card .label {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 5px;
            word-break: break-word;
        }

        .caa-card.not-found {
            border-color: #e74c3c;
            color: #e74c3c;
            justify-content: center;
        }

        .caa-card.not-found .error-msg {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Regole di Stampa */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .container {
                max-width: 100%;
            }

            .caa-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .caa-card {
                border: 2px solid #000;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Sezione configurazione (nascosta in stampa) -->
    <div class="no-print">
        <h1>Generatore Mappa CAA - Tema Universo</h1>
        <label for="wordsInput"><strong>Inserisci le parole (una per riga):</strong></label>
        <textarea id="wordsInput" placeholder="Inserisci le parole...">Sole&#10;Pianeta&#10;Stella&#10;Luna&#10;Terra&#10;Spazio&#10;Razzo&#10;Astronauta</textarea>
        
        <div class="btn-group">
            <button class="btn-generate" onclick="generateMap()">Genera Griglia</button>
            <button class="btn-print" onclick="window.print()">Stampa</button>
        </div>
    </div>

    <!-- Griglia CAA -->
    <div id="gridContainer" class="caa-grid"></div>
</div>

<script>
    async function generateMap() {
        const input = document.getElementById('wordsInput').value;
        const gridContainer = document.getElementById('gridContainer');
        
        // Pulisce la griglia esistente
        gridContainer.innerHTML = '';

        // Ricava le singole parole rimuovendo righe vuote e spazi in eccesso
        const words = input.split('\n')
                           .map(w => w.trim())
                           .filter(w => w.length > 0);

        for (const word of words) {
            const card = document.createElement('div');
            card.className = 'caa-card';

            try {
                // Chiamata all'API ARASAAC per cercare il pittogramma
                const response = await fetch(`https://api.arasaac.org/v1/pictograms/it/search/${encodeURIComponent(word)}`);
                
                if (!response.ok) {
                    throw new Error('Errore nella rete');
                }

                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    // Prende il primo risultato disponibile
                    const id = data[0]._id;
                    const imgUrl = `https://static.arasaac.org/pictograms/${id}/${id}_500.png`;

                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${word}">
                        <div class="label">${word}</div>
                    `;
                } else {
                    // Nessun pittogramma trovato
                    card.classList.add('not-found');
                    card.innerHTML = `
                        <div class="error-msg">Pittogramma non trovato</div>
                        <div class="label">${word}</div>
                    `;
                }
            } catch (error) {
                // Gestione errori della richiesta
                card.classList.add('not-found');
                card.innerHTML = `
                    <div class="error-msg">Errore di caricamento</div>
                    <div class="label">${word}</div>
                `;
            }

            gridContainer.appendChild(card);
        }
    }

    // Genera la griglia all'avvio con le parole predefinite
    window.onload = generateMap;
</script>

</body>
</html>
