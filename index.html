<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice - Canvas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            padding: 32px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #f1f5f9;
            border-radius: 8px;
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            border: 1px solid transparent;
        }

        .card:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            color: #0284c7;
            transform: translateY(-1px);
        }

        .card span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.2rem;
        }

        .arrow {
            color: #94a3b8;
            transition: transform 0.2s ease;
        }

        .card:hover .arrow {
            transform: translateX(4px);
            color: #0284c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Progetti Canvas</h1>
        <p class="subtitle">Seleziona un'applicazione per iniziare</p>

        <div class="list">
            <a href="operandoconiproblemi%20(2).html" class="card">
                <span>
                    <span class="icon">🧩</span>
                    Operando con i problemi
                </span>
                <span class="arrow">&rarr;</span>
            </a>

            <a href="geopiano.html" class="card">
                <span>
                    <span class="icon">📐</span>
                    Geopiano
                </span>
                <span class="arrow">&rarr;</span>
            </a>
        </div>
    </div>

</body>
</html>
